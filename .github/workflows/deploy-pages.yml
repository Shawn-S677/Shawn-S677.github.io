name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint portfolio
        run: npm run lint && npx nx lint portfolio-e2e

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run e2e

      - name: Build Angular site
        run: npm run build

      - name: Support direct route refresh on Pages
        run: cp dist/apps/portfolio/browser/index.html dist/apps/portfolio/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
