<article class="project-card" [class.featured]="project().route">
  <div class="project-meta">
    <span class="project-category">{{ project().category }}</span>
    <span class="status" [class.pending]="project().status === 'Coming Soon'"
      >{{ project().status }}</span
    >
  </div>
  <h3>{{ project().title }}</h3>
  <p>{{ project().description }}</p>
  <div class="tags" aria-label="Technology areas">
    @for (tag of project().tags; track tag) {
    <span>{{ tag }}</span>
    }
  </div>
  @if (project().route) {
  <div class="project-actions">
    <a class="text-link" [routerLink]="project().route">View case study</a>
    @if (project().repository) {
    <a
      class="text-link muted"
      [href]="project().repository"
      target="_blank"
      rel="noopener"
    >
      Repository
    </a>
    }
  </div>
  }
</article>
